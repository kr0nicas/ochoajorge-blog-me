version: 2
updates:
  # Actualizaciones de dependencias para el blog (Next.js + TypeScript)
  - package-ecosystem: "npm"
    directory: "/"
    # Los PRs de deps entran por develop (ver AGENTS.md); main solo recibe releases
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/El_Salvador"
    open-pull-requests-limit: 10
    reviewers:
      - "kr0nicas"
    labels:
      - "dependencies"
      - "npm"
    allow:
      # Solo actualizaciones directas, no transitive
      - dependency-type: "direct"
      - dependency-type: "development"
    ignore:
      # Ignorar versiones beta, rc, alpha
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
