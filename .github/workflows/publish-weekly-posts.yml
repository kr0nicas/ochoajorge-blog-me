name: Publish Weekly Posts

# Publicación programada de los posts del batch semanal.
# Cada job, en su fecha, cambia `draft: true` -> `draft: false` del post que le toca
# y abre un PR hacia `develop` (NUNCA hacia main, ni push directo a develop).
# Reglas doradas de AGENTS.md: el flujo es siempre vía PR.

on:
  schedule:
    # 08:00 CST (America/El_Salvador, UTC-6) = 14:00 UTC
    - cron: '0 14 25 8 *'   # Post 1: Klarna      — Martes 2026-08-25
    - cron: '0 14 27 8 *'   # Post 2: DoorDash    — Jueves 2026-08-27
    - cron: '0 14 29 8 *'   # Post 3: GitLab Duo  — Sábado 2026-08-29
  workflow_dispatch:
    inputs:
      post:
        description: 'Slug del archivo .mdx a publicar (sin extensión)'
        required: true
        default: 'agentes-ia-en-klarna-3-capas-de-juicio-y-el-humano-bajo-demanda'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish scheduled post
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Resolve target post slug
        id: slug
        run: |
          SLUG="${{ inputs.post }}"
          if [ -z "$SLUG" ]; then
            # Modo schedule: elige el slug según el día del calendario
            DAY=$(date -u +%d)
            MONTH=$(date -u +%m)
            case "${MONTH}-${DAY}" in
              08-25) SLUG="agentes-ia-en-klarna-3-capas-de-juicio-y-el-humano-bajo-demanda" ;;
              08-27) SLUG="plataforma-de-agentes-en-doordash-llm-gateway-mcp-y-evals-a-2000-diarios" ;;
              08-29) SLUG="gitlab-duo-y-el-roi-de-la-ia-como-medir-lo-que-los-agentes-aportan-al-sdlc" ;;
              *) echo "No post scheduled for ${MONTH}-${DAY}"; exit 0 ;;
            esac
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Publishing: $SLUG"

      - name: Flip draft to false
        if: steps.slug.outputs.slug != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          FILE="content/posts/es/${SLUG}.mdx"
          if [ ! -f "$FILE" ]; then echo "File not found: $FILE"; exit 1; fi
          python3 - "$FILE" <<'PY'
          import re, sys
          f = sys.argv[1]
          s = open(f, encoding="utf-8").read()
          s2 = re.sub(r'(^draft:\s*)true', r'\1false', s, count=1, flags=re.M)
          if s == s2:
              print("draft already false or not found — no change"); sys.exit(0)
          open(f, "w", encoding="utf-8").write(s2)
          print("draft flipped to false in", f)
          PY

      - name: Create PR to develop
        if: steps.slug.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          # El post ya podía estar en draft: false (publicado a mano, o un re-run del
          # mismo cron). Sin este guard, `git commit` sin nada staged sale 1 y el job
          # queda en rojo por algo que en realidad ya está hecho.
          if git diff --quiet; then
            echo "Sin cambios que publicar — el post ya estaba en draft: false."
            exit 0
          fi
          BR="content/publish-${SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add -A
          git commit -m "content(posts): publish ${SLUG}"
          git push -u origin "$BR"
          gh pr create --base develop --title "content(posts): publish ${SLUG}" \
            --body "Publicación programada del post de la semana del 2026-08-24. Cambia \`draft: true\` → \`draft: false\`. Generado por el workflow de contenido semanal." \
            --label "content"
